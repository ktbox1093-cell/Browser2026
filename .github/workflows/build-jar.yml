name: Build J2ME JAR

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Instalar Apache Ant
      run: sudo apt-get update && sudo apt-get install -y ant

    - name: Compilar y empaquetar con Ant
      run: ant all

    - name: Subir artefactos (JAR y JAD)
      uses: actions/upload-artifact@v4
      with:
        name: nokia-e72-browser-files
        path: |
          E72Browser.jar
          E72Browser.jad
